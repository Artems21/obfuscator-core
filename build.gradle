plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'

}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-snapshots/") }
    maven { url 'https://jitpack.io' }
    maven {
        url 'https://repo.codemc.io/repo/maven-public/'
    }
    maven {        url 'https://repo.fancyplugins.de/releases/'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}




dependencies {
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    implementation ("com.github.retrooper:packetevents-spigot:2.5.0")
    implementation ("com.github.Tofaa2.EntityLib:spigot:2.4.11")
    //compileOnly "me.clip:placeholderapi:2.11.6"
    implementation ("com.arcaniax:HeadDatabase-API:1.3.2")
    //compileOnly ("de.likewhat.customheads:CustomHeads:3.0.7")
    implementation ("com.github.LoneDev6:API-ItemsAdder:3.6.3-beta-14")
    implementation ("com.mojang:authlib:1.5.25")
    implementation ("com.github.decentsoftware-eu:decentholograms:2.8.11")
    implementation ("me.filoghost.holographicdisplays:holographicdisplays-api:3.0.0")
    implementation("de.oliver:FancyHolograms:2.5.0")
    implementation ("com.github.retrooper:packetevents-spigot:2.6.0")


}

test {
    useJUnitPlatform()
}

shadowJar {
    manifest {
        attributes(
                'Main-Class': 'org.jxfuscator.Main'
        )
    }
}
